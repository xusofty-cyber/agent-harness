# ==============================================================================
# Eval regression — agent-harness Phase 3
# Manual trigger + monthly schedule. Runs the deterministic parts of the
# benchmark (no agent executes tasks in CI):
#   - task specs valid, start-commit hash matches, solution patches apply
#     and make acceptance pass (eval/run-bench.sh smoke)
#   - recorded results recompute to the numbers in the baseline report,
#     and no upstream token number is quoted as our own
#     (eval/check-results.py)
#   - gate + pack arm setup paths still work (T1 setup per arm)
# Thresholds are provisional (baseline n=3, single executor). This workflow
# does NOT red-line on a single run's duration: thresholds apply to
# 12-run windows as defined in docs/bench/baseline-2026-10.md.
# ==============================================================================

name: Eval regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # monthly, 1st at 00:00 UTC

jobs:
  eval-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install pytest (fixture acceptance uses it)
        run: pip install pytest

      - name: Benchmark smoke (specs, start commit, solutions, acceptance)
        run: bash eval/run-bench.sh smoke

      - name: Results recompute to the baseline report
        run: python3 eval/check-results.py

      - name: Arm setup paths still work (T1 pack + gate)
        run: |
          bash eval/run-bench.sh setup --task t1-bugfix --arm pack --rep 0 --dest /tmp/eval-pack
          bash eval/run-bench.sh setup --task t1-bugfix --arm gate --rep 0 --dest /tmp/eval-gate
          test -f /tmp/eval-gate/gate/feature_list.json
          echo "pack + gate setup OK"
